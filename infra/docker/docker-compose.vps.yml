# Isolated OTV stack for the HealFast VPS.
# Does not share healfast-redis (6379) or existing Postgres containers.
services:
  postgres:
    image: postgres:16-alpine
    container_name: otv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: otv
      POSTGRES_PASSWORD: ${OTV_PG_PASSWORD}
      POSTGRES_DB: otv
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - otv_pg:/var/lib/postgresql/data
      - ../../database/migrations/001_core.sql:/docker-entrypoint-initdb.d/001_core.sql:ro
      - ../../database/migrations/002_production.sql:/docker-entrypoint-initdb.d/002_production.sql:ro
      - ../../database/seeds/001_demo.sql:/docker-entrypoint-initdb.d/003_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otv -d otv"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    container_name: otv-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - otv_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: otv-api
    restart: unless-stopped
    environment:
      PORT: 4080
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: postgres://otv:${OTV_PG_PASSWORD}@postgres:5432/otv
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      OTV_KMS_MASTER_KEY: ${OTV_KMS_MASTER_KEY}
      OTV_KEYS_DIR: /app/keys
      OTV_EMBED_WORKER: "0"
      COOKIE_SECURE: "1"
      COOKIE_SAMESITE: "lax"
      OTV_PUBLIC_URL: ${OTV_PUBLIC_URL:-https://otv.poptrust.me}
      ETH_RPC_URL: ${ETH_RPC_URL:-}
      EVM_PUBLIC_RPC: ${EVM_PUBLIC_RPC:-1}
      BTC_ESPLORA_URL: ${BTC_ESPLORA_URL:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      TRON_API_URL: ${TRON_API_URL:-}
      OTV_KMS_PROVIDER: ${OTV_KMS_PROVIDER:-local}
      AWS_KMS_KEY_ID: ${AWS_KMS_KEY_ID:-}
      AWS_REGION: ${AWS_REGION:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-otv-demo-change-me}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "otv.poptrust.me:host-gateway"
    ports:
      - "4080:4080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    container_name: otv-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://otv:${OTV_PG_PASSWORD}@postgres:5432/otv
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
  dex:
    image: ghcr.io/dexidp/dex:v2.42.1
    container_name: otv-dex
    restart: unless-stopped
    entrypoint: ["dex"]
    command: ["serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ../oidc/dex.yaml:/etc/dex/config.yaml:ro
      - otv_dex:/var/dex
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        VITE_OTV_API_URL: ${VITE_OTV_API_URL:-https://otv.poptrust.me}
    container_name: otv-web
    restart: unless-stopped
    ports:
      - "4090:80"
    depends_on:
      api:
        condition: service_started
  # Open Trust Admin console at https://otv.poptrust.me/trigger (Caddy → :4091)
  trigger:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.trigger
    container_name: otv-trigger
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      NEXT_PUBLIC_BASE_PATH: /trigger
      NEXT_PUBLIC_SITE_URL: ${OTV_PUBLIC_URL:-https://otv.poptrust.me}
      DATABASE_URL: postgres://otv:${OTV_PG_PASSWORD}@postgres:5432/otv
      SESSION_SECRET: ${SESSION_SECRET}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-otv-demo-change-me}
      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_PASSWORD: ${DEMO_PASSWORD:-otv-demo-change-me}
      # Prefer Base / VPS mainnet RPC; entrypoint falls back ETH / EVM / RPC_URL.
      # Do not invent Sepolia URLs — leave empty if unset on the VPS .env.
      BASE_RPC_URL: ${BASE_RPC_URL:-}
      ETH_RPC_URL: ${ETH_RPC_URL:-}
      EVM_RPC_URL: ${EVM_RPC_URL:-}
      RPC_URL: ${RPC_URL:-}
      CHAIN_ID: ${TRIGGER_CHAIN_ID:-8453}
      CHAIN_NAME: ${TRIGGER_CHAIN_NAME:-Base}
      BLOCK_EXPLORER_BASE: ${TRIGGER_BLOCK_EXPLORER_BASE:-https://basescan.org}
      EXPLORER_API_BASE: ${TRIGGER_EXPLORER_API_BASE:-https://api.basescan.org}
      ALLOW_MAINNET: ${TRIGGER_ALLOW_MAINNET:-true}
      ADMIN_ALLOWLIST: ${TRIGGER_ADMIN_ALLOWLIST:-}
      # Never invent keys. Empty unless set on the VPS .env.
      TRIGGER_ADMIN_SIGNER_PRIVATE_KEY: ${TRIGGER_ADMIN_SIGNER_PRIVATE_KEY:-}
      ADMIN_SIGNER_PRIVATE_KEY: ${TRIGGER_ADMIN_SIGNER_PRIVATE_KEY:-}
      # WalletConnect: reuse OTV web project id; entrypoint maps VITE_* → NEXT_PUBLIC_*.
      # Do not invent a project id — leave empty to gate WalletConnect in the UI.
      VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID:-}
      WALLETCONNECT_PROJECT_ID: ${WALLETCONNECT_PROJECT_ID:-}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      BASESCAN_API_KEY: ${BASESCAN_API_KEY:-}
      GOOGLE_GENAI_API_KEY: ${GOOGLE_GENAI_API_KEY:-}
      VERTEX_AGENT_ENDPOINT: ${VERTEX_AGENT_ENDPOINT:-}
    ports:
      - "127.0.0.1:4091:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/trigger/admin/login',r=>process.exit(r.statusCode&&r.statusCode<500?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 40s
volumes:
  otv_pg:
  otv_redis:
  otv_dex:
