services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: otv
      POSTGRES_PASSWORD: otv
      POSTGRES_DB: otv
    ports:
      - "5433:5432"
    volumes:
      - otv_pg:/var/lib/postgresql/data
      - ../../database/migrations/001_core.sql:/docker-entrypoint-initdb.d/001_core.sql:ro
      - ../../database/seeds/001_demo.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      PORT: 4080
      DATABASE_URL: postgres://otv:otv@postgres:5432/otv
      REDIS_URL: redis://redis:6379
    ports:
      - "4080:4080"
    depends_on:
      - postgres
      - redis
volumes:
  otv_pg:
