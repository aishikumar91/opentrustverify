name: OTV CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm --filter './packages/*' run build
      - run: pnpm --filter './packages/*' --filter @otv/api --filter @otv/conformance run test
      - run: pnpm demo
      - name: Fail if ethereum adapter still always-mocks
        run: |
          if grep -E "return this\.mock;" packages/chain-adapters/src/ethereum.ts; then
            echo "ethereum adapter still short-circuits to mock"
            exit 1
          fi
          grep -n "eth_getTransactionByHash" packages/chain-adapters/src/ethereum.ts
