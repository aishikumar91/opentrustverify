name: OTV CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # packageManager in package.json (pnpm@9.15.0) — do not also set `version`
      # here or pnpm/action-setup@v4 fails with a dual-spec error.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm --filter './packages/*' run build
      - run: pnpm --filter './packages/*' --filter @otv/api --filter @otv/conformance run test
      - run: pnpm demo
      - name: Fail if ethereum adapter still always-mocks
        run: |
          # Live EVM RPC lives in evm.ts; ethereum.ts is the createAdapter entry.
          if grep -E "return this\.mock;" packages/chain-adapters/src/evm.ts; then
            echo "ethereum adapter still short-circuits to mock"
            exit 1
          fi
          grep -n "eth_getTransactionByHash" packages/chain-adapters/src/evm.ts
